name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  nativo:
    name: backend + motor C++ (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --target pruebas -t prueba backend
      - run: docker run --rm prueba
      - run: docker run --rm prueba python nativo/bench.py 20000

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, nativo]
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
      - run: docker compose config --quiet && docker compose --profile publico config --quiet
