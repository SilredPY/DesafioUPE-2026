<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Ñangarekó IA: alertas de clima, cazabasurales y tránsito preventivo para Alto Paraná." />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ñangarekó" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <title>Ñangarekó IA</title>
    <script>
      // Aplica tema y color antes de pintar para evitar el parpadeo (misma lógica que src/shared/tema.ts).
      try {
        var t = localStorage.getItem('tema'), c = localStorage.getItem('color');
        if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.tema = t;
        if (c && /^#[0-9a-f]{6}$/i.test(c)) {
          var l = [1, 3, 5].map(function (i) {
            var v = parseInt(c.slice(i, i + 2), 16) / 255;
            return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
          });
          var s = document.documentElement.style;
          s.setProperty('--primario', c);
          s.setProperty('--primario-texto', 0.2126 * l[0] + 0.7152 * l[1] + 0.0722 * l[2] > 0.4 ? '#0b1412' : '#ffffff');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', c);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
