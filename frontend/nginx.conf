# Límite por IP real para escrituras (POST): frena a quien inventa muchos X-Device-Id desde una sola conexión.
# Detrás del túnel la IP real llega en CF-Connecting-IP; en la red local se usa la del cliente.
# shortcut: en la LAN el header CF-Connecting-IP se puede falsificar; si se publica sin túnel, usar solo $remote_addr.
map $http_cf_connecting_ip $ip_real { "" $remote_addr; default $http_cf_connecting_ip; }
map $request_method $ip_escritura { POST $ip_real; default ""; }  # clave vacía = sin límite (GET libres)
limit_req_zone $ip_escritura zone=reportes:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    include /etc/nginx/seguridad.conf;

    client_max_body_size 6m;  # fotos de hasta 5 MB + formulario

    location /api/ {
        limit_req zone=reportes burst=20 nodelay;  # holgado: una facultad entera puede compartir la misma IP
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;  # la clasificación con IA puede tardar
    }

    # Archivos con hash en el nombre: cachear para siempre.
    location /assets/ {
        include /etc/nginx/seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # El service worker y el HTML siempre frescos, para que las actualizaciones lleguen.
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        include /etc/nginx/seguridad.conf;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
