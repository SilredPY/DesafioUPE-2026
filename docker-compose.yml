services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: naangareko
      POSTGRES_PASSWORD: naangareko
      POSTGRES_DB: naangareko
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naangareko"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://naangareko:naangareko@db:5432/naangareko
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
