services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: naangareko
      POSTGRES_PASSWORD: naangareko
      POSTGRES_DB: naangareko
    ports: ["127.0.0.1:5432:5432"]  # solo accesible desde esta computadora
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/demo.sql:/demo/demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naangareko -d naangareko"]
      interval: 5s
      retries: 10

  # Aplica backend/db/esquema/*.sql en orden en cada arranque (los scripts son idempotentes).
  migrar:
    image: postgis/postgis:16-3.4
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: naangareko
    volumes:
      - ./backend/db/esquema:/esquema:ro
    entrypoint:
      - sh
      - -c
      - for f in /esquema/*.sql; do echo "migrando $$f"; psql -v ON_ERROR_STOP=1 -q -h db -U naangareko -d naangareko -f "$$f" || exit 1; done

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://naangareko:naangareko@db:5432/naangareko
      CLIMA_DEMO: ${CLIMA_DEMO:-}
    ports: ["127.0.0.1:8000:8000"]  # Swagger en /docs, solo local
    depends_on:
      migrar:
        condition: service_completed_successfully

  web:
    build: ./frontend
    restart: unless-stopped
    ports: ["80:80"]
    depends_on: [api]

  # Link público HTTPS gratis (sin cuenta ni dominio): docker compose --profile publico up -d
  # La URL aparece con: docker compose logs tunel | grep trycloudflare
  tunel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: [publico]
    command: tunnel --no-autoupdate --url http://web:80
    depends_on: [web]

volumes:
  pgdata:
