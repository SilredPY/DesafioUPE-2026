services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: naangareko
      POSTGRES_PASSWORD: naangareko
      POSTGRES_DB: naangareko
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./backend/db/demo.sql:/demo/demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naangareko"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://naangareko:naangareko@db:5432/naangareko
      CLIMA_DEMO: ${CLIMA_DEMO:-}
    ports: ["8000:8000"]  # Swagger en /docs
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports: ["80:80"]
    depends_on: [api]

volumes:
  pgdata:
